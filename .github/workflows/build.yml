name: Build packages
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: New release tag to build as a draft
        required: true
        type: string
      release_notes:
        description: 'Optional release notes/comment (use \n for line breaks; Markdown is preserved)'
        required: false
        type: string

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preparation:
    name: Setup build version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      commitish: ${{ steps.version.outputs.commitish }}
      release_notes: ${{ steps.version.outputs.release_notes }}
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0
      - id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.release_tag || '' }}
          INPUT_RELEASE_NOTES: ${{ inputs.release_notes || '' }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(git describe --tags --exact-match 2>/dev/null || true)
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must use x.y.z format, got: ${VERSION:-<empty>}" >&2
            exit 1
          fi
          COMMITISH=$(git rev-parse HEAD)
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            TAG_COMMIT=$(git rev-parse "refs/tags/$VERSION^{commit}")
            if [ "$TAG_COMMIT" != "$COMMITISH" ]; then
              echo "Release tag $VERSION points to $TAG_COMMIT, not the checked-out commit $COMMITISH" >&2
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commitish=$COMMITISH" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import os
          import uuid

          notes = os.environ['INPUT_RELEASE_NOTES']
          notes = notes.replace('\r\n', '\n').replace('\r', '\n').replace('\\n', '\n')
          delimiter = f'ghadelimiter_{uuid.uuid4().hex}'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'release_notes<<{delimiter}\n{notes}\n{delimiter}\n')
          PY

  build:
    name: Build Trafira release packages
    runs-on: ubuntu-24.04
    needs: preparation
    steps:
      - uses: actions/checkout@v5.0.0

      - name: Install build dependencies
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install -y build-essential curl fakeroot file gawk git patch perl tar unzip util-linux xz-utils zstd

      - name: Build release artifacts
        shell: bash
        run: |
          VERSION="${{ needs.preparation.outputs.version }}"
          ./build.sh "$VERSION" "$PWD/filtered-bin/release"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: release-files-${{ needs.preparation.outputs.version }}
          path: ./filtered-bin/release/*
          retention-days: 1
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    needs:
      - preparation
      - build
    steps:
      - uses: actions/checkout@v5.0.0
      - name: Create release dir
        run: mkdir -p ./filtered-bin/release

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-files-${{ needs.preparation.outputs.version }}
          path: ./filtered-bin/release

      - name: Guard existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preparation.outputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          tag = os.environ['RELEASE_TAG']
          # Authenticated listing includes drafts. Do not treat a 404 as proof
          # of absence: it can also mean an authentication/permission failure.
          for page in range(1, 101):
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}/releases?per_page=100&page={page}',
                  headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      releases = json.load(response)
              except (OSError, ValueError, urllib.error.URLError):
                  raise SystemExit('Cannot verify release absence; refusing to upload assets')
              if not isinstance(releases, list):
                  raise SystemExit('Invalid release list; refusing to upload assets')
              for release in releases:
                  if (not isinstance(release, dict)
                          or type(release.get('id')) is not int
                          or not isinstance(release.get('tag_name'), str)
                          or not release['tag_name']
                          or type(release.get('draft')) is not bool):
                      raise SystemExit('Invalid release metadata; refusing to upload assets')
                  if release['tag_name'] == tag:
                      raise SystemExit(f'Release {tag} already exists; refusing to modify its state or assets')
              if len(releases) < 100:
                  break
          else:
              raise SystemExit('Release listing limit reached; refusing to upload assets')
          print(f'No existing release for {tag}; draft creation is allowed')
          PY

      - name: Release
        uses: softprops/action-gh-release@v2.4.0
        with:
          files: ./filtered-bin/release/*
          draft: true
          prerelease: false
          make_latest: false
          overwrite_files: false
          name: Trafira ${{ needs.preparation.outputs.version }}
          tag_name: ${{ needs.preparation.outputs.version }}
          target_commitish: ${{ needs.preparation.outputs.commitish }}
          body: ${{ needs.preparation.outputs.release_notes }}
