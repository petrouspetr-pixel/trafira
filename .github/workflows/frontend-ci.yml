name: Frontend CI

on:
  workflow_dispatch:
    inputs:
      build_test_bundle:
        description: Build an installable UI test artifact without a release
        type: boolean
        default: false
      test_version:
        description: Version displayed by the temporary UI artifact
        type: string
        default: dev
  pull_request:
    paths:
      - 'fe-app-trafira/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  frontend-checks:
    name: Frontend Quality Checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: fe-app-trafira

    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        working-directory: fe-app-trafira
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: Cache yarn dependencies
        uses: actions/cache@v4.3.0
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('fe-app-trafira/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check formatting
        id: format
        run: |
          yarn format
          if ! git diff --exit-code; then
            echo "::error::Code is not formatted. Run 'yarn format' locally."
            exit 1
          fi

      - name: Run linter
        run: yarn lint --max-warnings=0

      - name: Run tests
        run: yarn test --run

      - name: Build project
        id: build
        run: |
          yarn build
          if ! git diff --exit-code; then
            echo "::error::Build generated changes. Check build output."
            exit 1
          fi

      - name: Prepare UI test artifact
        env:
          TEST_UI_VERSION: ${{ inputs.test_version }}
        if: github.event_name == 'workflow_dispatch' && inputs.build_test_bundle
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TEST_UI_VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+|dev)$ ]] || exit 1
          luci_revision=76f7b462d8d842cb392c2902d35af34ee4ae2130
          tool_root=$(mktemp -d "$RUNNER_TEMP/trafira-lmo.XXXXXX")
          curl --proto '=https' --proto-redir '=https' -fsSL --connect-timeout 15 --max-time 120 \
            "https://codeload.github.com/openwrt/luci/tar.gz/$luci_revision" -o "$tool_root/luci.tar.gz"
          tar -xzf "$tool_root/luci.tar.gz" -C "$tool_root"
          make -C "$tool_root/luci-$luci_revision/modules/luci-base/src" po2lmo
          bundle="$RUNNER_TEMP/trafira-ui-test"
          mkdir -p "$bundle"
          "$tool_root/luci-$luci_revision/modules/luci-base/src/po2lmo" \
            ../luci-app-trafira/po/ru/trafira.po "$bundle/trafira.ru.lmo"
          sed "s/__COMPILED_VERSION_VARIABLE__/$TEST_UI_VERSION/g" \
            ../luci-app-trafira/htdocs/luci-static/resources/view/trafira/main.js > "$bundle/main.js"
          printf '%s\n' "$GITHUB_SHA" > "$bundle/REVISION"
          (cd "$bundle" && sha256sum main.js trafira.ru.lmo REVISION > SHA256SUMS)

      - name: Upload UI test artifact
        if: github.event_name == 'workflow_dispatch' && inputs.build_test_bundle
        uses: actions/upload-artifact@v4.6.2
        with:
          name: trafira-ui-test-${{ github.sha }}
          path: ${{ runner.temp }}/trafira-ui-test/
          retention-days: 1
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          echo "## Frontend CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Format check: ${{ steps.format.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Lint check: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Tests: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Build: ${{ steps.build.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "![Success](https://cdn2.combot.org/boratbrat/webp/6xf09f988f.webp)" >> $GITHUB_STEP_SUMMARY
