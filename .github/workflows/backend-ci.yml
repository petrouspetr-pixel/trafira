name: Backend CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'trafira/files/**'
      - 'trafira/Makefile'
      - 'trafira/compact-sources.py'
      - 'build.sh'
      - 'install.sh'
      - 'uninstall.sh'
      - 'tools/benchmark-ucode.py'
      - 'tests/**'
      - '.github/workflows/build.yml'
      - '.github/workflows/backend-ci.yml'
  push:
    branches:
      - main
      - 'rc/**'
    paths:
      - 'trafira/files/**'
      - 'trafira/Makefile'
      - 'trafira/compact-sources.py'
      - 'build.sh'
      - 'install.sh'
      - 'uninstall.sh'
      - 'tools/benchmark-ucode.py'
      - 'tests/**'
      - '.github/workflows/build.yml'
      - '.github/workflows/backend-ci.yml'

jobs:
  apk-core-transactions:
    name: APK Core Transactions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5.0.0
      - name: Prepare official OpenWrt APK tool
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          curl --proto '=https' --proto-redir '=https' -fsSL --max-time 180 \
            https://downloads.openwrt.org/releases/25.12.3/targets/x86/64/openwrt-sdk-25.12.3-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst \
            -o "$RUNNER_TEMP/sdk.tar.zst"
          echo "70fc990b2f9a2705e8bbca610e421a55e789901d4aeba10d9fdd7c89777bf695  $RUNNER_TEMP/sdk.tar.zst" | sha256sum -c -
          mkdir "$RUNNER_TEMP/apk-sdk"
          tar --zstd -xf "$RUNNER_TEMP/sdk.tar.zst" -C "$RUNNER_TEMP/apk-sdk"
          apk_bin=$(find "$RUNNER_TEMP/apk-sdk" -path '*/staging_dir/host/bin/apk' -type f -print -quit)
          test -n "$apk_bin" && test -x "$apk_bin"
          echo "APK_BIN=$apk_bin" >> "$GITHUB_ENV"
      - name: Verify isolated core replacements with real APK solver
        run: sudo env APK_BIN="$APK_BIN" bash tests/issue96_apk_solver.sh

  backend-checks:
    name: Backend Runtime Checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0

      - name: Build ucode
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libjson-c-dev pkg-config
          git clone --depth 1 --branch v0.0.20250529 https://github.com/jow-/ucode.git /tmp/ucode
          cmake -S /tmp/ucode -B /tmp/ucode/build \
            -DUBUS_SUPPORT=OFF \
            -DUCI_SUPPORT=OFF \
            -DULOOP_SUPPORT=OFF
          cmake --build /tmp/ucode/build --parallel
          sudo cmake --install /tmp/ucode/build
          sudo ldconfig
          command -v ucode
          ucode -e 'print("ucode ready\n")'

      - name: Test RAM bytecode cache
        run: python3 -B tests/test_bytecode_cache.py

      - name: Measure source and bytecode startup
        run: python3 tools/benchmark-ucode.py --report "${{ runner.temp }}/trafira-bytecode-benchmark.json"

      - name: Check ucode syntax
        shell: bash
        run: |
          find trafira/files/usr/lib -name '*.uc' -print0 | xargs -0 -n1 ucode -c -o /dev/null
          find trafira/files/usr/lib -name '*.uc' -print0 | xargs -0 -n1 ucode -S -c -o /dev/null

      - name: Run backend tests
        shell: bash
        run: |
          printf '%s\0' tests/*.sh | xargs -0 -n1 -P4 bash -c 'bash "$1" || { status=$?; echo "FAILED: $1 (exit $status)" >&2; exit 1; }' _

      - name: Run backend tests on compacted installed sources
        shell: bash
        run: |
          compact_root=$(mktemp -d /tmp/trafira-compact-runtime.XXXXXX)
          git worktree add --detach "$compact_root" HEAD
          python3 "$compact_root/trafira/compact-sources.py" "$compact_root/trafira/files" --report "$RUNNER_TEMP/trafira-compaction.json"
          cd "$compact_root"
          export TRAFIRA_COMPACT_RUNTIME=1
          printf '%s\0' tests/*.sh | xargs -0 -n1 -P4 bash -c 'bash "$1" || { status=$?; echo "FAILED compact sources: $1 (exit $status)" >&2; exit 1; }' _

      - name: Test cache with current ucode runtime
        shell: bash
        run: |
          current_root=$(mktemp -d /tmp/trafira-ucode-current.XXXXXX)
          git clone https://github.com/ucode-lang/ucode.git "$current_root/source"
          git -C "$current_root/source" checkout d2e8b8d2052778557ccca7e781d2ad423324961b
          cmake -S "$current_root/source" -B "$current_root/build" \
            -DCMAKE_INSTALL_PREFIX="$current_root/runtime" \
            -DUBUS_SUPPORT=OFF -DUCI_SUPPORT=OFF -DULOOP_SUPPORT=OFF
          cmake --build "$current_root/build" --parallel
          cmake --install "$current_root/build"
          PATH="$current_root/runtime/bin:$PATH" \
          LD_LIBRARY_PATH="$current_root/runtime/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            python3 -B tests/test_bytecode_cache.py

      - name: Upload installed size report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: installed-backend-size
          path: |
            ${{ runner.temp }}/trafira-compaction.json
            ${{ runner.temp }}/trafira-bytecode-benchmark.json
          if-no-files-found: ignore
