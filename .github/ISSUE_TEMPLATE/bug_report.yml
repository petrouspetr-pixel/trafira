name: Сообщить об ошибке
description: Помогите воспроизвести и исправить проблему Trafira.
title: "[Ошибка]: "
body:
  - type: markdown
    attributes:
      value: "Не публикуйте пароли, ключи, ссылки подписок и полные конфигурации. Проверьте, нет ли уже такого сообщения в Issues."
  - type: input
    id: versions
    attributes:
      label: Версии Trafira и OpenWrt, модель роутера
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как повторить ошибку
      description: Укажите вкладку, действия и нажатые кнопки.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что ожидалось и что произошло
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Журнал и снимки экрана
      description: Только относящиеся к ошибке фрагменты без секретов и персональных данных.
